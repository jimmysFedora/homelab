name: pangolin
services:
  pangolin:
    image: fosrl/pangolin:ee-1.19.2@sha256:4b35c2539089a4f99176f1420aacadc103ddb0768e020d465e647386bebe33ee
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: ghcr.io/fosrl/gerbil:1.4.2@sha256:6d640c114be57435b37b5a042872f116b53e984546f351820d6a758436d0f991
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51830:51830/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 25565:25565  # minecraft

  traefik:
    image: docker.io/traefik:v3.7
    container_name: traefik
    restart: unless-stopped

    network_mode: service:gerbil  # Ports appear on the gerbil service

    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro  # Volume to store the Traefik configuration
      - ./config/letsencrypt:/letsencrypt  # Volume to store the Let's Encrypt certificates
      - ./config/traefik/logs:/var/log/traefik  # Volume to store Traefik logs

networks:
  default:
    driver: bridge
    name: pangolin
    # enable_ipv6: true  # activate if your system supports IPv6
