apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
  namespace: flux-system
spec:
  releaseName: linkwarden  # add this
  targetNamespace: default
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: infrastructure/charts/linkwarden
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 5m
  valuesFrom: []
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3