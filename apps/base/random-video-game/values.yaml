

controllers:
  main:
    strategy: Recreate

    containers:
      main:
        image:
          repository: ghcr.io/jimmysfedora/random-game-discord-bot
          tag: "{{ .Chart.AppVersion }}"
        env:
          DATA_FOLDER: "app"
        envFrom:
          - secretRef: 
              name: gamebot-secrets

serviceAccount:
  create: true # This forces Helm to create the SA that it is trying to reference

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app
    # existingClaim: ""