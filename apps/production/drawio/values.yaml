app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: jgraph/drawio
            tag: "30.0.4"
      strategy: Recreate

  ingress:
    main:
      className: traefik
      hosts:
      - host: drawio.mistyfumes.dev
        paths:
        - path: /
          pathType: Prefix
          service:
            identifier: main
            port: http
      tls:
      - hosts:
        - drawio.mistyfumes.dev
        secretName: prod-mistyfumes-tls

  service:
    main:
      controller: main
      ports:
        http:
          port: 8080