controllers:
  karakeep:
    containers:
      karakeep:
#         env:
#           DISABLE_PASSWORD_AUTH: "true"
#           OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
#           OAUTH_PROVIDER_NAME: OIDC
#           OAUTH_SCOPE: openid email profile
#           OAUTH_WELLKNOWN_URL: https://auth.company/application/o/karakeep/.well-known/openid-configuration
        envFrom:
          - secretRef:
              name: karakeep-secrets

ingress:
  karakeep:
    className: traefik
    hosts:
      - host: karakeep.mistyfumes.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: karakeep
              port: http
    tls:
      - hosts:
          - karakeep.mistyfumes.dev
        secretName: prod-mistyfumes-tls

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: "truenas-iscsi"
    size: 1Gi
    retain: true
    advancedMounts:
      karakeep:
        karakeep:
          - path: /data

