apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base/linkwarden
  - linkwarden-sealed-secret.yaml
configMapGenerator:
  - name: linkwarden-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
patches:
  - patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: linkwarden-values
            valuesKey: values.yaml
      # ADD THIS BLOCK TO FORCE THE NAMESPACE
      - op: add
        path: /spec/targetNamespace
        value: default
    target:
      kind: HelmRelease
      name: linkwarden