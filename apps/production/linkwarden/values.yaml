controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/linkwarden/linkwarden
          tag: "v2.14.1@sha256:93a543cca29362849c98e4504a43c65a7222c5a3868da86da9bec364360a8733"
        envFrom:
          - secretRef:
              name: linkwarden-secrets
    strategy: Recreate

ingress:
  main:
    className: traefik
    hosts:
      - host: linkwarden.mistyfumes.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - linkwarden.mistyfumes.dev
        secretName: prod-mistyfumes-tls

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  data:
    type: persistentVolumeClaim
    existingClaim: linkwarden-data
    globalMounts:
      - path: /data/data
