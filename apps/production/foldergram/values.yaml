controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/foldergram/foldergram
          tag: "1.2.2"
    strategy: Recreate

ingress:
  main:
    className: traefik
    hosts:
      - host: foldergram.mistyfumes.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - foldergram.mistyfumes.dev
        secretName: prod-mistyfumes-tls

service:
  main:
    controller: main
    ports:
      http:
        port: 4141

persistence:
  db:
    enabled: true
    type: persistentVolumeClaim
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/data/db

  gallery:
    type: persistentVolumeClaim
    existingClaim: foldergram-gallery
    globalMounts:
      - path: /app/data/gallery

  thumbnails:
    enabled: true
    type: persistentVolumeClaim
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /app/data/thumbnails

  previews:
    enabled: true
    type: persistentVolumeClaim
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /app/data/previews
