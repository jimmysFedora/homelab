---
controllers:
  main:
    containers:
      main:
        image:
          repository: corentinth/it-tools
          tag: "2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f"
    strategy: Recreate

ingress:
  main:
    className: traefik
    hosts:
    - host: it-tools.mistyfumes.dev
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
    tls:
    - hosts:
      - it-tools.mistyfumes.dev
      secretName: prod-mistyfumes-tls

service:
  main:
    controller: main
    ports:
      http:
        port: 80
