controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/alexta69/metube
          tag: "2026.04.28@sha256:caf21da7d83a4003b429ef1126e9c1499f36f8401a1f8a7b158f70b94ade8edd"
    strategy: Recreate

ingress:
  main:
    className: traefik
    hosts:
    - host: metube.mistyfumes.dev
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
    tls:
    - hosts:
      - metube.mistyfumes.dev
      secretName: prod-mistyfumes-tls

service:
  main:
    controller: main
    ports:
      http:
        port: 8081

configMaps:
  app-config:
    data:
      DELETE_FILE_ON_TRASHCAN: "true"

persistence:
  downloads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: truenas-iscsi
    size: 10Gi
    globalMounts:
      - path: /downloads
