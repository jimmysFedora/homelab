apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base/random-video-game
  - gamebot-sealed-secret.yaml
configMapGenerator:
  - name: random-video-game-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
patches:
  - patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: random-video-game-values
            valuesKey: values.yaml
    target:
      kind: HelmRelease
      name: random-video-game
