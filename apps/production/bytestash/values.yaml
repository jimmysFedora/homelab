ingress:
  enabled: true
  hosts:
    - host: bytestash.mistyfumes.dev
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: prod-mistyfumes-tls
      hosts:
        - bytestash.mistyfumes.dev

volumes:
  - name: bytestash-data
    persistentVolumeClaim:
      claimName: bytestash-nfs-pvc

volumeMounts:
  - name: bytestash-data
    mountPath: "/data/snippets"