controllers:
  main:
    containers:
      main:
        env:
          DATA_FOLDER: /data
        image:
          repository: deluan/navidrome
          tag: "0.61.2"
    strategy: Recreate

ingress:
  main:
    className: traefik
    hosts:
    - host: navidrome.dev.mistyfumes.dev
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
    tls:
    - hosts:
      - navidrome.dev.mistyfumes.dev
      secretName: dev-mistyfumes-tls

persistence:
  data:
    accessMode: ReadWriteOnce
    globalMounts:
    - path: /data
    size: 1Gi
    type: persistentVolumeClaim

service:
  main:
    controller: main
    ports:
      http:
        port: 4533