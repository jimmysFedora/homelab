---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base/ats-server
  - ats-sealed-secret.yaml
configMapGenerator:
  - name: ats-server-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
patches:
  - patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: ats-server-values
            valuesKey: values.yaml
    target:
      kind: HelmRelease
      name: ats-server
